<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A comet crossing the night sky: the four-pointed star the whole interface is drawn
       with, a tail in the topic colour warming to spark gold, and two sparks. -->
  <defs>
    <radialGradient id="sky" cx="66%" cy="34%" r="80%">
      <stop offset="0" stop-color="#4a2a58"/>
      <stop offset="0.55" stop-color="#26152f"/>
      <stop offset="1" stop-color="#150c1d"/>
    </radialGradient>
    <linearGradient id="tail" x1="8" y1="57" x2="42" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb08a" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffb08a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffc86b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc86b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc86b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <path d="M37 19 Q21 33 7 58 Q29 43 46 28 Z" fill="url(#tail)"/>
  <circle cx="42" cy="23" r="15" fill="url(#glow)"/>
  <path transform="translate(42 23) scale(1.6)" fill="#fff3dc"
        d="M0-11C1.4-3.2 3.2-1.4 11 0 3.2 1.4 1.4 3.2 0 11-1.4 3.2-3.2 1.4-11 0-3.2-1.4-1.4-3.2 0-11Z"/>
  <circle cx="16" cy="17" r="2.2" fill="#ffc86b"/>
  <circle cx="52" cy="50" r="1.7" fill="#ffc86b" opacity="0.85"/>
</svg>
